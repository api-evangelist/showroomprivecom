description: 'Showroomprive.com is a French online private-sales (flash-sales) e-commerce
  platform operated by Showroomprive.com SAS, a subsidiary of SRP Groupe SA, based in
  La Plaine Saint-Denis. It sells discounted apparel, beauty, home, sports, and travel
  products from major brands, and also runs a third-party seller marketplace. The company
  exposes a private marketplace / seller API reached through partner onboarding and
  surfaced by third-party integration platforms such as ChannelEngine and Commercium,
  but it publishes no public developer portal, API documentation, or OpenAPI. Added to
  the API Evangelist network as an Accel portfolio lead.'
